[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedalus-converger"
version = "0.1.0"
description = "Domain-agnostic reconciliation engine with explicit refusal semantics"
authors = [{name = "Dedalo Smith"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "proxmoxer>=2.0",
    "pyyaml",
    "click",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "pre-commit"]

[project.scripts]
converger = "dedalus_converger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/converger"]
