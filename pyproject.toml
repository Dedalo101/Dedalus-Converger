[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedalus-converger"
version = "0.1.0"
description = "Domain-agnostic reconciliation engine with explicit refusal semantics"
authors = [{name = "Dedalo Smith"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "proxmoxer>=2.0",
    "pyyaml",
    "click",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest", "black", "ruff", "pre-commit"]

[project.scripts]
converger = "converger.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/converger"]
